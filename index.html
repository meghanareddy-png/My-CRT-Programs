<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My CRT Programs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8ED;
    --panel:#FFFFFF;
    --panel-2:#FFF1DC;
    --line:#F0DFC2;
    --grape:#7C5CFC;
    --pink:#FF6FA5;
    --sun:#FFB238;
    --mint:#2FBF8F;
    --ink:#2B2140;
    --muted:#9086A8;
    --red:#F0554B;
    --code-bg:#2B2140;
    --code-fg:#F3EFFF;
  }
  body.dark{
    --cream:#14101F;
    --panel:#1E1830;
    --panel-2:#271F3D;
    --line:#453A66;
    --grape:#B79CFF;
    --pink:#FF9FC9;
    --sun:#FFD166;
    --mint:#6BFFC7;
    --ink:#FBFAFF;
    --muted:#B9AEDA;
    --red:#FF8F87;
    --code-bg:#0C0916;
    --code-fg:#F0EBFF;
  }
  body.dark .brand h1{
    background: linear-gradient(90deg, var(--grape), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  body.dark .post-head h3{ color: var(--sun); }
  body.dark .block-label{ color: var(--mint); }
  body.dark .tag{ color: var(--pink); }
  body.dark pre.code-block{ box-shadow: inset 0 0 0 1px var(--line); }
  body.dark pre.output-block{ color: var(--mint); border-color: var(--line); }
  body.dark ::selection{ background: var(--grape); color:#14101F; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    transition: background .2s ease, color .2s ease;
  }
  ::selection{ background: var(--sun); color:#2B2140; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:6px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px;
    border-bottom:3px solid var(--ink);
    background: var(--panel);
    position:sticky; top:0; z-index:10;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--grape), var(--pink));
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:16px; color:#fff;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .brand h1{ font-family:'Fredoka', sans-serif; font-size:20px; margin:0; color:var(--ink); }
  .brand .tag{ color:var(--muted); font-size:12.5px; font-weight:600; padding-left:10px; border-left:2px solid var(--line); margin-left:2px; }

  button{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:13.5px;
    border:2.5px solid var(--ink); border-radius:9px; padding:9px 18px; cursor:pointer;
    transition: transform .06s ease, box-shadow .06s ease;
    box-shadow: 2.5px 2.5px 0 var(--ink);
    background:#fff; color:#211934;
  }
  button:hover{ transform: translate(-1px,-1px); box-shadow: 3.5px 3.5px 0 var(--ink); }
  button:active{ transform: translate(1px,1px); box-shadow: 0 0 0 var(--ink); }
  .btn-new{ background: var(--grape); color:#fff; }

  .feed{
    max-width: 780px; margin: 0 auto; padding: 28px 20px 80px;
  }

  .empty-state{
    text-align:center; padding: 80px 20px; color:var(--muted);
  }
  .empty-state .big{ font-size:44px; display:block; margin-bottom:14px; }
  .empty-state h2{ font-family:'Fredoka', sans-serif; color:var(--ink); margin:0 0 8px; font-size:19px; }
  .empty-state p{ margin:0 0 20px; font-size:14px; }

  .post{
    background: var(--panel);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 26px;
    overflow:hidden;
  }
  .post-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px 12px;
  }
  .post-head h3{ font-family:'Fredoka', sans-serif; font-size:18px; margin:0; color:var(--ink); }
  .post-actions{ display:flex; gap:8px; }
  .icon-btn{
    border:2px solid var(--line); box-shadow:none; background:#fff; padding:6px 10px; font-size:12px; color:#211934;
  }
  .icon-btn:hover{ box-shadow:none; border-color: var(--grape); }
  .icon-btn.danger:hover{ border-color: var(--red); color: var(--red); }

  .post-body{ padding: 0 20px 18px; }
  .block-label{
    font-family:'Fredoka', sans-serif; font-size:11px; font-weight:600; letter-spacing:0.4px;
    color:var(--muted); text-transform:uppercase; margin: 12px 0 6px;
  }
  pre.code-block{
    background: var(--code-bg); color: var(--code-fg);
    border-radius:10px; padding:14px 16px; margin:0;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.6;
    overflow-x:auto; white-space:pre;
  }
  pre.output-block{
    background: var(--panel-2); color:var(--ink);
    border:2px dashed var(--line);
    border-radius:10px; padding:14px 16px; margin:0;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.6;
    overflow-x:auto; white-space:pre-wrap;
  }
  .timestamp{ font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono', monospace; padding: 0 20px 16px; margin-top:-8px; }

  /* modal */
  .modal-veil{
    position:fixed; inset:0; background: rgba(43,33,64,0.45); z-index:70;
    display:none; align-items:flex-start; justify-content:center; padding:40px 20px;
    overflow-y:auto;
  }
  .modal-veil.show{ display:flex; }
  .modal{
    background: var(--panel); border:3px solid var(--ink); border-radius:16px;
    width:100%; max-width:600px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 24px 28px 28px;
  }
  .modal h3{ font-family:'Fredoka', sans-serif; margin:0 0 4px; font-size:19px; color:var(--ink);}
  .modal .sub{ color:var(--muted); font-size:13px; margin:0 0 18px; }
  .modal label{ display:block; font-family:'Fredoka', sans-serif; font-weight:600; font-size:12.5px; color:var(--ink); margin: 14px 0 6px; }
  .modal input[type=text], .modal textarea{
    width:100%; border:2px solid var(--line); border-radius:8px; padding:10px 12px;
    font-family:'Inter', sans-serif; font-size:13.5px; color:#211934; outline:none;
    background:#FFFDF7;
  }
  .modal textarea{ font-family:'JetBrains Mono', monospace; font-size:13px; resize:vertical; line-height:1.5;}
  #f-code{ min-height:180px; }
  #f-output{ min-height:90px; }
  .modal input:focus, .modal textarea:focus{ border-color:var(--grape); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn-cancel{ background:#fff; color:#7A7290; }
  .btn-save{ background: var(--grape); color:#fff; }

  @media (max-width: 600px){
    .post-head{ flex-direction:column; align-items:flex-start; gap:8px; }
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 3px solid var(--grape); outline-offset:2px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">&gt;_</div>
    <h1>My CRT Programs</h1>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button class="icon-btn" id="btn-theme" style="box-shadow:2.5px 2.5px 0 var(--ink); border-width:2.5px;" aria-label="Toggle dark mode">🌙 Dark</button>
    <button class="btn-new" id="btn-new">+ Post a program</button>
  </div>
</div>

<div class="feed" id="feed"></div>

<div class="modal-veil" id="modal-veil">
  <div class="modal">
    <h3 id="modal-title">Post a program</h3>
    <p class="sub">Give it a name, paste the code, and add the output if you've got it.</p>

    <label for="f-name">Program name</label>
    <input type="text" id="f-name" placeholder="e.g. Armstrong Number Check">

    <label for="f-code">Code</label>
    <textarea id="f-code" spellcheck="false" placeholder="n = int(input())&#10;..."></textarea>

    <label for="f-output">Output (optional)</label>
    <textarea id="f-output" spellcheck="false" placeholder="Paste the output here"></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" id="f-cancel">Cancel</button>
      <button class="btn-save" id="f-save">Post it 🎉</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// SHARED STORAGE SETUP — one-time, do this before you publish:
// 1. Go to https://console.firebase.google.com -> Add project (free plan is fine)
// 2. In the project: Build -> Realtime Database -> Create Database
// 3. Under the "Rules" tab, set:  { "rules": { ".read": true, ".write": true } }
//    (this makes the board fully public/shared, which is what you asked for —
//    anyone with the link can post or delete, same as a public noticeboard)
// 4. Copy the database URL shown at the top, e.g.
//    https://your-project-id-default-rtdb.firebaseio.com
// 5. Paste it below, replacing the empty string.
// ---------------------------------------------------------------
const FIREBASE_URL = "https://console.firebase.google.com/project/my-crt-programs/database/my-crt-programs-default-rtdb/data/~2F"; // <-- paste your Realtime Database URL here, no trailing slash

let posts = [];
let editingId = null;
let backendReady = !!FIREBASE_URL;

const els = {
  feed: document.getElementById("feed"),
  newBtn: document.getElementById("btn-new"),
  modalVeil: document.getElementById("modal-veil"),
  modalTitle: document.getElementById("modal-title"),
  fName: document.getElementById("f-name"),
  fCode: document.getElementById("f-code"),
  fOutput: document.getElementById("f-output"),
  fCancel: document.getElementById("f-cancel"),
  fSave: document.getElementById("f-save"),
};

async function load(){
  if (!backendReady){ posts = []; return; }
  try {
    const res = await fetch(`${FIREBASE_URL}/posts.json`);
    const data = await res.json();
    posts = data ? Object.values(data) : [];
  } catch (e) {
    posts = [];
  }
}

async function savePostRemote(post){
  if (!backendReady) return;
  await fetch(`${FIREBASE_URL}/posts/${post.id}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(post)
  });
}

async function deletePostRemote(id){
  if (!backendReady) return;
  await fetch(`${FIREBASE_URL}/posts/${id}.json`, { method: "DELETE" });
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function formatTime(ts){
  const d = new Date(ts);
  return d.toLocaleString(undefined, { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
}

function render(){
  els.feed.innerHTML = "";
  if (!backendReady){
    els.feed.innerHTML = `
      <div class="empty-state">
        <span class="big">🔌</span>
        <h2>Shared board isn't connected yet</h2>
        <p>Add your Firebase database URL to the <code>FIREBASE_URL</code> line near the top of the &lt;script&gt; tag in this file, then reload. See the setup steps in the code comments right above it.</p>
      </div>`;
    return;
  }
  if (posts.length === 0){
    els.feed.innerHTML = `
      <div class="empty-state">
        <span class="big">🗂️</span>
        <h2>No programs posted yet</h2>
        <p>Tap "+ Post a program" to add your first CRT Python program.</p>
      </div>`;
    return;
  }
  // newest first
  const ordered = [...posts].sort((a,b) => b.createdAt - a.createdAt);
  ordered.forEach(p => {
    const el = document.createElement("div");
    el.className = "post";
    el.innerHTML = `
      <div class="post-head">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="post-actions">
          <button class="icon-btn" data-action="edit" data-id="${p.id}">Edit</button>
          <button class="icon-btn danger" data-action="delete" data-id="${p.id}">Delete</button>
        </div>
      </div>
      <div class="post-body">
        <div class="block-label">Code</div>
        <pre class="code-block">${escapeHtml(p.code)}</pre>
        ${p.output ? `<div class="block-label">Output</div><pre class="output-block">${escapeHtml(p.output)}</pre>` : ""}
      </div>
      <div class="timestamp">Posted ${formatTime(p.createdAt)}</div>
    `;
    els.feed.appendChild(el);
  });
}

function openModal(post){
  editingId = post ? post.id : null;
  els.modalTitle.textContent = post ? "Edit program" : "Post a program";
  els.fName.value = post ? post.name : "";
  els.fCode.value = post ? post.code : "";
  els.fOutput.value = post ? post.output : "";
  els.modalVeil.classList.add("show");
  setTimeout(() => els.fName.focus(), 50);
}
function closeModal(){ els.modalVeil.classList.remove("show"); }

els.newBtn.addEventListener("click", () => openModal(null));
els.fCancel.addEventListener("click", closeModal);
els.modalVeil.addEventListener("click", (e) => { if (e.target === els.modalVeil) closeModal(); });

els.fSave.addEventListener("click", async () => {
  const name = els.fName.value.trim();
  if (!name){ els.fName.focus(); return; }
  const code = els.fCode.value;
  const output = els.fOutput.value.trim();

  let post;
  if (editingId){
    post = posts.find(p => p.id === editingId);
    if (post){ post.name = name; post.code = code; post.output = output; }
  } else {
    post = { id: "post-" + Date.now(), name, code, output, createdAt: Date.now() };
    posts.push(post);
  }
  render();
  closeModal();
  els.fSave.disabled = true;
  await savePostRemote(post);
  els.fSave.disabled = false;
  await load();
  render();
});

els.feed.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.getAttribute("data-id");
  const post = posts.find(p => p.id === id);
  if (!post) return;
  if (btn.dataset.action === "edit"){
    openModal(post);
  } else if (btn.dataset.action === "delete"){
    if (confirm(`Delete "${post.name}"? This can't be undone, and it'll disappear for everyone.`)){
      posts = posts.filter(p => p.id !== id);
      render();
      await deletePostRemote(id);
    }
  }
});

const THEME_KEY = "bench-theme";
const btnTheme = document.getElementById("btn-theme");

function applyTheme(mode){
  document.body.classList.toggle("dark", mode === "dark");
  btnTheme.textContent = mode === "dark" ? "☀️ Light" : "🌙 Dark";
}
function loadTheme(){
  let mode = null;
  try { mode = localStorage.getItem(THEME_KEY); } catch(e){}
  if (!mode){
    mode = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  applyTheme(mode);
}
btnTheme.addEventListener("click", () => {
  const next = document.body.classList.contains("dark") ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
});

loadTheme();
load().then(render);

window.addEventListener("focus", () => { if (backendReady) load().then(render); });
</script>
</body>
</html>
